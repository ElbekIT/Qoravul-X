workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up code signing
        script: |
          set -e
          echo "Setting up keystore and key.properties..."
          mkdir -p android/app
          cat << 'EOF' | base64 --decode > android/app/upload-keystore.jks
          
          EOF
          cp android/app/upload-keystore.jks android/upload-keystore.jks

          cat << 'EOF' > android/key.properties
          storePassword=AlgorixSecurePass2026!
          keyPassword=AlgorixSecurePass2026!
          keyAlias=algorix-upload
          storeFile=upload-keystore.jks
          EOF
      - name: Get dependencies
        script: |
          flutter packages pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.aab