name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # GitHub saytidan bitta tugma bilan ishga tushirish imkoni

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriy kodini olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Paketlarni yuklash
        run: flutter pub get

      - name: Kodni tahlil qilish (Analyze)
        run: flutter analyze

      - name: Testlarni tekshirish (Test)
        run: flutter test

      - name: Release APK yig'ish
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Tayyor APK faylni saqlash (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Qoravul-X-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
