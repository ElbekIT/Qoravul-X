name: qoravul_x
description: "Qoravul X — Telefoningiz xavfsizligi, har bir tekshiruvda."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.1
  http: ^1.2.1
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  permission_handler: ^11.3.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  share_plus: ^9.0.0
  installed_apps: ^1.5.0
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  mobile_scanner: ^5.1.1
  receive_sharing_intent: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
